name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          mkdir -p "release/mcbot-${VERSION}"
          rsync -av \
            --exclude='node_modules' \
            --exclude='.env' \
            --exclude='data/*.json' \
            --exclude='.git' \
            --exclude='release' \
            . "release/mcbot-${VERSION}/"
          cd release
          tar -czf "mcbot-${VERSION}.tar.gz" "mcbot-${VERSION}"
          zip -r "mcbot-${VERSION}.zip" "mcbot-${VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: mcbot ${{ github.ref_name }}
          body: |
            ## mcbot ${{ github.ref_name }}

            Minecraft AI Bot — Ollama (free) and Hack Club AI (optional).

            ### Quick setup

            1. Download the file for your platform:
               - **Windows**: `mcbot-${{ github.ref_name }}.zip`
               - **Linux/Mac**: `mcbot-${{ github.ref_name }}.tar.gz`
            2. Extract and enter the folder
            3. Run the setup script:
               - **Windows**: `.\scripts\setup.ps1`
               - **Linux/Mac**: `bash scripts/setup.sh`
            4. Open `.env` and configure your server details
            5. Start the bot with the start script

            ### Requirements

            - Node.js 18+
            - Ollama (https://ollama.com/)
          files: |
            release/mcbot-${{ github.ref_name }}.tar.gz
            release/mcbot-${{ github.ref_name }}.zip
